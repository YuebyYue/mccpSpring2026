<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Co-pilot for Ultrasound Scanning - Wang Yue</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #526175;
      --paper: #fbfcfd;
      --line: #d6dee8;
      --teal: #0f766e;
      --blue: #2563eb;
      --coral: #e85d4f;
      --amber: #f59e0b;
      --green: #16a34a;
      --violet: #7c3aed;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #e9eef5;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    main {
      width: min(100vw - 36px, 1280px);
      aspect-ratio: 16 / 9;
      background: var(--paper);
      border: 1px solid #cad3df;
      box-shadow: 0 18px 42px rgba(23, 32, 51, 0.18);
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    text {
      fill: var(--ink);
    }

    .title {
      font-size: 62px;
      font-weight: 780;
      letter-spacing: 0;
    }

    .subtitle {
      font-size: 23px;
      fill: var(--muted);
      font-weight: 520;
    }

    .small {
      font-size: 22px;
      fill: var(--muted);
      font-weight: 540;
    }

    .label {
      font-size: 27px;
      font-weight: 760;
    }

    .body {
      font-size: 24px;
      fill: var(--muted);
      font-weight: 520;
    }

    .bubble-text {
      font-size: 24px;
      font-weight: 700;
      fill: #ffffff;
    }

    .impact-text {
      font-size: 25px;
      font-weight: 760;
      fill: #ffffff;
    }

    .source {
      font-size: 16px;
      fill: #69768a;
      font-weight: 520;
    }

    .card {
      fill: #ffffff;
      stroke: var(--line);
      stroke-width: 2;
    }

    .soft-shadow {
      filter: drop-shadow(0 10px 16px rgba(23, 32, 51, 0.14));
    }
  </style>
</head>
<body>
  <main aria-label="One-slide 3MT visual for Wang Yue">
    <svg viewBox="0 0 1600 900" role="img" aria-labelledby="slide-title slide-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="slide-title">AI Co-pilot for Ultrasound Scanning</title>
      <desc id="slide-desc">A one-page 3MT visual showing ultrasound as a skill-heavy scan that can be supported by a multimodal AI co-pilot, turning video, voice, reports, and probe motion into real-time guidance.</desc>

      <defs>
        <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0f172a"/>
          <stop offset="55%" stop-color="#164e63"/>
          <stop offset="100%" stop-color="#0f766e"/>
        </linearGradient>
        <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#e85d4f"/>
          <stop offset="50%" stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#0f766e"/>
        </linearGradient>
        <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
          <path d="M 0 1 L 11 6 L 0 11 Z" fill="#526175"/>
        </marker>
        <marker id="arrowColor" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
          <path d="M 0 1 L 11 6 L 0 11 Z" fill="#0f766e"/>
        </marker>
        <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
          <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e7edf5" stroke-width="1"/>
        </pattern>
      </defs>

      <rect x="0" y="0" width="1600" height="900" fill="#fbfcfd"/>
      <rect x="0" y="0" width="1600" height="900" fill="url(#grid)" opacity="0.58"/>

      <text x="70" y="96" class="title">AI Co-pilot for Ultrasound Scanning</text>
      <text x="73" y="135" class="subtitle">Wang Yue | Proposed doctoral research direction inspired by Prof. Xiaoqing Guo's UltraVision+ Lab</text>

      <g transform="translate(66 190)" class="soft-shadow">
        <rect class="card" x="0" y="0" width="395" height="480" rx="22"/>
        <text x="34" y="55" class="label">The problem</text>
        <text x="34" y="94" class="body">Ultrasound depends on</text>
        <text x="34" y="125" class="body">expert eyes and steady hands.</text>

        <g transform="translate(45 168)">
          <rect x="36" y="12" width="230" height="160" rx="16" fill="url(#screenGrad)" stroke="#172033" stroke-width="7"/>
          <rect x="82" y="177" width="138" height="26" rx="8" fill="#172033"/>
          <rect x="49" y="206" width="204" height="20" rx="10" fill="#334155"/>

          <ellipse cx="151" cy="91" rx="74" ry="48" fill="#d1fae5" opacity="0.23"/>
          <path d="M 91 103 C 116 43, 204 45, 214 111 C 181 96, 149 140, 91 103 Z" fill="#d1fae5" opacity="0.62"/>
          <path d="M 129 86 C 148 63, 183 70, 190 102 C 169 90, 151 105, 129 86 Z" fill="#fbfcfd" opacity="0.46"/>
          <path d="M 78 41 C 130 12, 199 22, 236 66" fill="none" stroke="#94f0d6" stroke-width="4" opacity="0.7"/>
          <path d="M 74 142 C 128 178, 211 160, 237 113" fill="none" stroke="#94f0d6" stroke-width="4" opacity="0.55"/>

          <path d="M 299 137 C 330 126, 347 143, 343 165 C 338 192, 301 192, 287 176" fill="none" stroke="#172033" stroke-width="13" stroke-linecap="round"/>
          <rect x="260" y="118" width="66" height="38" rx="16" transform="rotate(-22 293 137)" fill="#e85d4f" stroke="#172033" stroke-width="5"/>
          <path d="M 315 157 L 261 210" stroke="#172033" stroke-width="8" stroke-linecap="round"/>
          <circle cx="250" cy="220" r="19" fill="#f59e0b" stroke="#172033" stroke-width="5"/>
        </g>

        <g transform="translate(35 420)">
          <circle cx="16" cy="16" r="16" fill="#e85d4f"/>
          <text x="45" y="23" class="body">Hard to know what to look for</text>
        </g>
      </g>

      <path d="M 500 425 C 610 320, 704 320, 807 424" fill="none" stroke="#526175" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="12 12"/>

      <g transform="translate(540 210)">
        <text x="260" y="50" text-anchor="middle" class="label">My aim</text>
        <text x="260" y="87" text-anchor="middle" class="body">Turn a difficult scan into a guided journey</text>

        <g transform="translate(85 128)" class="soft-shadow">
          <circle cx="175" cy="175" r="140" fill="#ffffff" stroke="#d6dee8" stroke-width="3"/>
          <circle cx="175" cy="175" r="104" fill="#eefdfa" stroke="#99f6e4" stroke-width="2"/>
          <path d="M 175 77 C 231 93, 267 132, 274 175 C 247 158, 220 157, 196 176 C 171 197, 143 195, 105 175 C 114 127, 137 94, 175 77 Z" fill="#0f766e" opacity="0.9"/>
          <path d="M 93 206 C 140 219, 178 218, 210 193 C 232 176, 257 179, 273 197 C 261 247, 222 279, 174 279 C 136 279, 103 250, 93 206 Z" fill="#2563eb" opacity="0.9"/>
          <circle cx="176" cy="175" r="27" fill="#ffffff"/>
          <path d="M 176 121 L 188 174 L 247 188 L 190 201 L 176 255 L 163 201 L 106 188 L 164 174 Z" fill="#f59e0b" stroke="#172033" stroke-width="4"/>
          <text x="175" y="339" text-anchor="middle" class="label" fill="#0f766e">AI co-pilot</text>
        </g>

        <g transform="translate(0 155)">
          <rect x="0" y="0" width="146" height="56" rx="28" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
          <circle cx="31" cy="28" r="13" fill="#2563eb"/>
          <text x="58" y="36" class="small">Video</text>
          <path d="M 147 31 C 190 47, 218 73, 247 119" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowColor)"/>
        </g>

        <g transform="translate(0 270)">
          <rect x="0" y="0" width="154" height="56" rx="28" fill="#ffffff" stroke="#e85d4f" stroke-width="3"/>
          <path d="M 29 16 C 44 16, 44 40, 29 40 C 14 40, 14 16, 29 16 Z" fill="#e85d4f"/>
          <path d="M 53 17 C 68 27, 68 31, 53 40" fill="none" stroke="#e85d4f" stroke-width="5" stroke-linecap="round"/>
          <text x="75" y="36" class="small">Voice</text>
          <path d="M 156 24 C 197 11, 223 31, 249 79" fill="none" stroke="#e85d4f" stroke-width="3" marker-end="url(#arrowColor)"/>
        </g>

        <g transform="translate(366 155)">
          <rect x="0" y="0" width="168" height="56" rx="28" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
          <path d="M 33 16 L 50 34 L 33 52 L 16 34 Z" fill="#f59e0b"/>
          <text x="66" y="36" class="small">Motion</text>
          <path d="M -3 31 C -43 47, -70 73, -97 119" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowColor)"/>
        </g>

        <g transform="translate(366 270)">
          <rect x="0" y="0" width="168" height="56" rx="28" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
          <rect x="19" y="15" width="28" height="34" rx="4" fill="#7c3aed"/>
          <path d="M 26 25 L 40 25 M 26 34 L 40 34 M 26 43 L 36 43" stroke="#ffffff" stroke-width="3"/>
          <text x="65" y="36" class="small">Reports</text>
          <path d="M -5 24 C -44 11, -72 31, -98 79" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowColor)"/>
        </g>
      </g>

      <path d="M 1085 425 C 1186 320, 1274 322, 1375 425" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#arrowColor)" stroke-dasharray="14 10"/>

      <g transform="translate(1160 190)" class="soft-shadow">
        <rect class="card" x="0" y="0" width="376" height="480" rx="22"/>
        <text x="34" y="55" class="label">The goal</text>
        <text x="34" y="94" class="body">Real-time guidance for</text>
        <text x="34" y="125" class="body">people learning to scan.</text>

        <g transform="translate(34 164)">
          <rect x="0" y="0" width="308" height="62" rx="31" fill="#0f766e"/>
          <text x="31" y="39" class="bubble-text">What am I seeing?</text>
        </g>
        <g transform="translate(34 244)">
          <rect x="0" y="0" width="308" height="62" rx="31" fill="#2563eb"/>
          <text x="31" y="39" class="bubble-text">Is this view clear?</text>
        </g>
        <g transform="translate(34 324)">
          <rect x="0" y="0" width="308" height="62" rx="31" fill="#e85d4f"/>
          <text x="31" y="39" class="bubble-text">What did I miss?</text>
        </g>
        <g transform="translate(34 404)">
          <rect x="0" y="0" width="308" height="62" rx="31" fill="#f59e0b"/>
          <text x="31" y="39" class="bubble-text">Where should I move?</text>
        </g>
      </g>

      <g transform="translate(70 724)">
        <rect x="0" y="0" width="1460" height="94" rx="28" fill="url(#pathGrad)"/>
        <text x="52" y="59" class="impact-text">Shorter learning curve</text>
        <circle cx="455" cy="47" r="8" fill="#ffffff" opacity="0.8"/>
        <text x="510" y="59" class="impact-text">More consistent scans</text>
        <circle cx="900" cy="47" r="8" fill="#ffffff" opacity="0.8"/>
        <text x="956" y="59" class="impact-text">Better access to skilled care</text>
      </g>

      <text x="70" y="862" class="source">Sources: Prof. Xiaoqing Guo homepage; UltraVision+ Lab; Sonomate fetal ultrasound work. Slide uses text, SVG shapes, and CSS only.</text>
    </svg>
  </main>
</body>
</html>
